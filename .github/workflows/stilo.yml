# Tests Stilo: the web app and editor in headless Chrome, the Python package
# (server and CLI) with pytest, and the package `stilo` built and installed.

name: stilo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The runner image has Chrome, which @web/test-runner-chrome finds
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest

  # Builds the package `stilo` (CLI, server and web app in one wheel) and
  # tries it outside the checkout
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build
      - name: Build the package
        run: uv build
      - name: Check that the package has the web app and the Texl library
        run: |
          unzip -l dist/*.whl | grep -q 'stilo/web/index.html'
          unzip -l dist/*.whl | grep -q 'stilo/texl-lib/index.texl'
          unzip -l dist/*.whl | grep -q 'stilo/texl-lib/dataframe.texl'
          unzip -l dist/*.whl | grep -q 'stilo/tutorial/index.texl'
      - name: Try the installed command
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          cp -r examples "$RUNNER_TEMP/examples"
          cd "$RUNNER_TEMP"
          venv/bin/stilo render examples/projects/beam/beam-check.texl > /dev/null
          venv/bin/stilo init project
          mkdir project/docs
          echo '<% texl.import "~/lib/stilo/index.texl" ~> (lib -> bind "stilo" lib.data.stilo) %><% stilo.dataframe {columns: ["CI"], rows: [[42]]} %>' > project/docs/a.texl
          venv/bin/stilo render --strict project/docs/a.texl | grep -q '| 42 |'
          venv/bin/stilo serve examples --port 8765 &
          for i in $(seq 50); do curl -sf -o /dev/null localhost:8765/_api/tree/ && break; sleep 0.2; done
          curl -sf -H 'Accept: text/html' localhost:8765/sample.texl | grep -q '<title>Stilo</title>'
          venv/bin/stilo tutor --dir tutorial --no-browser --port 8766 &
          for i in $(seq 50); do curl -sf -o /dev/null localhost:8766/index.texl && break; sleep 0.2; done
          curl -sf localhost:8766/index.texl | grep -q 'Learn Stilo'
          venv/bin/stilo render --strict tutorial/07-data-tables.texl > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: stilo-package
          path: dist/
