# Releases Stilo: at a pushed tag vX.Y.Z, tests and builds the package
# `stilo` (web app included) and the npm package @onlabsorg/stilo-web,
# publishes them on PyPI and npm by Trusted Publishing (no tokens: PyPI and
# npm trust this workflow, in the environments `pypi` and `npm`), and creates
# the GitHub release with the changelog entry and the built files.

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME, but pyproject.toml has version $version"; exit 1; }
          web_version=$(node -p 'require("./web/package.json").version')
          test "$web_version" = "$version" || {
            echo "pyproject.toml has version $version, but web/package.json has $web_version"; exit 1; }
          grep -q "^## $version " CHANGELOG.md || {
            echo "CHANGELOG.md has no entry for $version"; exit 1; }
      - name: Test and build the web app
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: Pack the npm package and build a project that uses it
        working-directory: web
        run: npm run check-package -- --out="$GITHUB_WORKSPACE/npm"
      - name: Test the Python package
        run: uv run pytest
      - name: Build the package
        run: uv build
      - name: Check that the package has the web app
        run: unzip -l dist/*.whl | grep -q 'stilo/web/index.html'
      - name: Try the installed command
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          cp -r examples "$RUNNER_TEMP/examples"
          cd "$RUNNER_TEMP"
          venv/bin/stilo render examples/projects/beam/beam-check.texl > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: npm/

  # Waits for npm, so a failed npm publish stops the release before PyPI has
  # the version: fixed, it can be tagged again with the same number.
  pypi:
    needs: [build, npm]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stilo-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Publishes the very tarball the build job checked. Trusted Publishing needs
  # npm 11.5.1 or later, which Node 24 brings; it adds provenance by itself.
  npm:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@onlabsorg/stilo-web
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: npm/
      # ./ makes npm read a file: npm/x.tgz alone is taken for a GitHub repository
      - run: npm publish ./npm/*.tgz --access public

  github-release:
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v h="## $version " 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' \
            CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Stilo $version" --notes-file notes.md
