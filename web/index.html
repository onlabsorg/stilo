<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Stilo</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <script>
            // Apply the saved theme before the first paint (default: dark).
            try {
                const theme = localStorage.getItem("stilo-theme");
                if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
            } catch {}
        </script>
        <script type="module">
            import { startStilo } from "/src/main.js";
            startStilo();
        </script>
    </head>
    <body></body>
</html>
