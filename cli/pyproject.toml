[project]
name = "stilo"
version = "0.0.1"
description = "Stilo: edit and render a folder of linked Texl documents"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pytexl>=0.4",
    "stilo-server",
    "uvicorn>=0.30",
]

[project.scripts]
stilo = "stilo.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
stilo-server = { path = "../server", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stilo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
