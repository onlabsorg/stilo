[project]
name = "stilo-server"
version = "0.0.1"
description = "Stilo server: serves a folder of Texl documents and the Stilo web app"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stilo_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
