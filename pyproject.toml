# The Python project of Stilo and its only published package, `stilo` (on
# PyPI `stilo-cli`: `stilo` is refused as too close to an existing name):
#
#   src/stilo/cli      the `stilo` command
#   src/stilo/server   the server (never imports the CLI)
#   src/stilo/web      the built web app, written by `npm run build` in web/
#                      (git-ignored; built into the package when present —
#                      the release workflow checks that the wheel has it)
#   texl-lib/          the Texl library `stilo init` copies into projects,
#                      shipped in the wheel as stilo/texl-lib
#   tutorial/          the lessons `stilo tutor` copies and serves, shipped
#                      in the wheel as stilo/tutorial
#
# Build:
#
#   cd web && npm ci && npm run build && cd ..
#   uv build                  # dist/stilo_cli-<version>.tar.gz and .whl

[project]
name = "stilo-cli"
version = "0.4.0"
description = "Stilo: edit and render a folder of linked Texl documents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "platformdirs>=4",
    "pytexl>=0.9.0",
    "uvicorn>=0.30",
]

[project.scripts]
stilo = "stilo.cli:main"

[project.urls]
Documentation = "https://www.onlabs.org/manual/"
Source = "https://github.com/onlabsorg/stilo"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/stilo", "texl-lib", "tutorial", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/stilo"]

# In a checkout the CLI reads texl-lib/ and tutorial/ where they are
# (stilo/cli/project.py, stilo/cli/tutor.py).
[tool.hatch.build.targets.wheel.force-include]
"texl-lib" = "stilo/texl-lib"
"tutorial" = "stilo/tutorial"

# src/stilo/web is git-ignored: include it anyway when it is there. Not a
# forced include, so that editable installs (`uv run`) work without it.
[tool.hatch.build]
artifacts = ["src/stilo/web/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
