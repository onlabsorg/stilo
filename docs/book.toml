[book]
title = "Stilo"
description = "The editor for Texl documents"
authors = ["Marcello Del Buono"]
language = "en"
src = "src"

[build]
build-dir = "../target/book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/onlabsorg/stilo"
edit-url-template = "https://github.com/onlabsorg/stilo/edit/main/docs/{path}"
site-url = "/stilo/book/"
additional-css = ["assets/texl.css", "assets/book.css", "assets/stilo.css"]
additional-js = ["assets/texl-highlight.js", "assets/book.js"]

[output.html.search]
limit-results = 20
